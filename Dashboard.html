<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
</head>

<body>

<h2>Dashboard</h2>

<button onclick="logout()">Logout</button>

<h3>Add Task</h3>
<input id="client" placeholder="Client ID">
<input id="work" placeholder="Work">
<input id="period" placeholder="Period">
<input id="duedate" type="date">
<input id="staff" placeholder="Staff ID">

<select id="priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>

<select id="status">
<option>Pending</option>
<option>Completed</option>
</select>

<button onclick="addTask()">Add Task</button>

<h3>Tasks</h3>
<table border="1">
<thead>
<tr>
<th>Client</th>
<th>Work</th>
<th>Due</th>
<th>Status</th>
</tr>
</thead>
<tbody id="taskTable"></tbody>
</table>

<script>

const apiURL = "PASTE_YOUR_APPS_SCRIPT_URL";

const role = localStorage.getItem("role");
const staffID = localStorage.getItem("staffID");

if(!role){
  window.location.href = "login.html";
}

function loadTasks() {
  fetch(apiURL + "?sheet=Tasks")
  .then(res => res.json())
  .then(data => {

    const table = document.getElementById("taskTable");
    table.innerHTML = "";

    data.forEach(task => {

      if(role === "Staff" && task.StaffID !== staffID) return;

      table.innerHTML += `
        <tr>
          <td>${task.ClientID}</td>
          <td>${task.WorkType}</td>
          <td>${task.DueDate}</td>
          <td>${task.Status}</td>
        </tr>
      `;
    });
  });
}

function addTask() {

  fetch(apiURL + "?action=addTask", {
    method: "POST",
    body: JSON.stringify({
      TaskID: Date.now(),
      ClientID: document.getElementById("client").value,
      WorkType: document.getElementById("work").value,
      Period: document.getElementById("period").value,
      DueDate: document.getElementById("duedate").value,
      StaffID: document.getElementById("staff").value,
      Priority: document.getElementById("priority").value,
      Status: document.getElementById("status").value
    })
  })
  .then(() => {
    alert("Task Added");
    loadTasks();
  });
}

function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

loadTasks();

</script>

</body>
</html>
