<script>
function login() {
  fetch("https://script.google.com/macros/s/AKfycbwh8E7LLOfcLhiQseDmVQdWLT5OuOzG8pgU02yQF-ETdXUFxn4WBYEPYEhKEBcefH3PmQ/exec", {
    method: "POST",
    body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status === "success") {
      alert("Login Success");
      window.location.href = "dashboard.html";
    } else {
      alert("Invalid Login");
    }
  })
  .catch(err => {
    alert("Error connecting to server");
    console.log(err);
  });
}
</script>
